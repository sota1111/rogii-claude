[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogii-well-log"
version = "0.1.0"
description = "Data and local evaluation utilities for ROGII well-log correlation"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
